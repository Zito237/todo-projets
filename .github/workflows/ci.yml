# Intégration continue (cours INF563, séance 9) : à chaque push et à chaque pull
# request, GitHub rejoue TOUTE la suite de tests (non-régression).
# Ordre de la pyramide : les tests les plus rapides d'abord, pour échouer au plus tôt.
# Le test de mutation, lent, est réservé au pipeline de nuit (comme les tests @Tag("lent")).
name: CI - tests TDD et BDD

on:
  push:              # n'importe quelle branche
  pull_request:      # avant toute fusion
  schedule:
    - cron: '17 2 * * *'   # chaque nuit à 02 h 17 UTC : tout rejouer, mutation comprise
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions

jobs:
  tdd:
    name: TDD - tests unitaires, pairwise, oracles (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances (versions figées par package-lock.json)
        run: npm ci

      - name: Lancer les tests avec la couverture
        run: npm run test:couverture

      - name: Publier le rapport de couverture
        if: always()   # surtout quand les tests échouent : c'est là qu'on a besoin du rapport
        uses: actions/upload-artifact@v4
        with:
          name: couverture-vitest
          path: coverage/

  bdd:
    name: BDD - scénarios Gherkin dans Chrome (Cucumber + Playwright)
    needs: tdd       # inutile de lancer les tests lents si les tests rapides sont rouges
    runs-on: ubuntu-latest   # Google Chrome est préinstallé sur cette machine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Exécuter les scénarios BDD
        run: npm run test:bdd

      - name: Publier le rapport Cucumber (captures d'écran des échecs incluses)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-bdd
          path: reports/cucumber/

  mutation:
    name: Mutation (Stryker) - pipeline de nuit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tdd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test de mutation (échoue sous 80 % de mutants tués)
        run: npm run test:mutation

      - name: Publier le rapport de mutation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-mutation
          path: reports/mutation/
